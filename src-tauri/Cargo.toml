[package]
name = "financetrackerapp"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "financetrackerapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-fs = "2.7.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "sync"] }
futures-util = "0.3.34"
thiserror = "2.0.21"
keyring = { version = "3.6", features = ["apple-native"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
