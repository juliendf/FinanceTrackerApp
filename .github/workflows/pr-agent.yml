# PR-Agent: an LLM review on pull requests.
#
# /review runs automatically when a pull request is opened (or a draft is
# marked ready). It is the cheap pass — one comment, read in the time it takes
# to open the PR — and it is worth paying for on every PR, because a solo
# developer merging their own work has no other reviewer before the fact.
#
# The expensive commands stay on demand:
#
#   /review     findings on the diff          (automatic on open, rerun by hand)
#   /improve    concrete code suggestions     (manual: the LLM-heavy one)
#   /describe   a title and summary for the PR  (manual: solo author knows the why)
#   /ask <q>    a question about the change   (manual: pointed questions)
#
# Comment triggers are restricted to the repository owner: the repo is public,
# and an open trigger is an open invitation to spend the key. The automatic
# review carries the same guard, plus skipping drafts and re-running on push —
# the comment command covers iterations.

name: pr-agent

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    # The command may appear anywhere in the comment, because a leading space or
    # a "sure, /review it" sentence are both legitimate ways to type it. Only the
    # repo owner can trigger a run, so a stray mention costs nothing they did not
    # ask for.
    if: >
      ( github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.event.comment.user.login == github.repository_owner &&
        ( contains(github.event.comment.body, '/review') ||
          contains(github.event.comment.body, '/improve') ||
          contains(github.event.comment.body, '/ask') ||
          contains(github.event.comment.body, '/describe') ) ) ||
      ( github.event_name == 'pull_request' &&
        github.event.pull_request.user.login == github.repository_owner &&
        github.event.pull_request.draft == false )
    runs-on: ubuntu-latest
    steps:
      - name: PR Agent
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # LiteLLM reads GEMINI_API_KEY for `gemini/...` models. Swap the model
          # in .pr_agent.toml, not here.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Applies to pull_request events only; comment commands ignore it.
          github_action_config.auto_review: "true"
