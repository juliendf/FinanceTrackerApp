# PR-Agent: an LLM review on pull requests.
#
# Runs only when asked. Reviewing every push on a public repository spends the
# API key on CI noise, and a large diff — like the 0.6.0 release — produces a
# shallower review than a focused one.
#
# Trigger it by commenting a command on the pull request:
#
#   /review     findings on the diff
#   /improve    concrete code suggestions
#   /describe   a title and summary for the PR
#   /ask <q>    a question about the change
#
# Comment triggers are restricted to the repository owner: the repo is public,
# and an open trigger is an open invitation to spend the key.

name: pr-agent

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-agent-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    # The command may appear anywhere in the comment, because a leading space or
    # a "sure, /review it" sentence are both legitimate ways to type it. Only the
    # repo owner can trigger a run, so a stray mention costs nothing they did not
    # ask for.
    if: >
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == github.repository_owner &&
      ( contains(github.event.comment.body, '/review') ||
        contains(github.event.comment.body, '/improve') ||
        contains(github.event.comment.body, '/ask') ||
        contains(github.event.comment.body, '/describe') )
    runs-on: ubuntu-latest
    steps:
      - name: PR Agent
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # LiteLLM reads GEMINI_API_KEY for `gemini/...` models. Swap the model
          # in .pr_agent.toml, not here.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
