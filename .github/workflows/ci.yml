# Typecheck, unit tests and the Rust suite on every push and pull request.
# Same steps the release workflow gates on, without the signing keys.

name: ci

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:

permissions:
  contents: read

# Keyed by PR number where there is one, so a branch push and its pull request
# do not share a group. `cancel-in-progress` off: the only run this ever
# cancelled was itself, queued, before a runner was assigned.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
