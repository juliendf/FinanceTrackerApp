# Builds, signs and publishes a macOS release when a tag is pushed.
#
#   git tag v0.4.0 && git push origin v0.4.0
#
# The tag must match `version` in src-tauri/tauri.conf.json; the first step
# fails otherwise. The release is created as a draft: publish it from the
# Releases page once the DMG looks right. `latest.json` only becomes visible to
# the in-app updater when the release is published (not a draft).
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY (required — update artifacts are signed),
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (only if the key was generated with one),
# and optionally the Apple signing/notarisation set documented in
# docs/RELEASE.md. Without an Apple certificate, tauri.release.conf.json signs
# ad hoc, which is what macOS Apple silicon requires for a downloaded app.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match tauri.conf.json version v$version"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Tests first: a release that fails its own suite should never be signed.
      - run: npm run typecheck
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build, sign and publish the draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Update artifacts (latest.json, .app.tar.gz.sig). The private key is
          # outside the repository on purpose; see docs/RELEASE.md.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Do NOT add empty Apple variables here: an empty APPLE_SIGNING_IDENTITY
          # overrides the ad-hoc identity from tauri.release.conf.json with "",
          # and signing then fails. Add the real set together with the
          # Developer ID (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD if the updater
          # key has one).
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "FinanceTracker __VERSION__"
          # Left empty on purpose: the next step writes the body from
          # docs/CHANGELOG.md. A literal here drifted once already, and shipped a
          # release describing the previous version.
          releaseBody: ""
          # Turn on once releases carry user-facing changes worth auto-summarising;
          # the first release describes the app instead of listing 70 commits.
          generateReleaseNotes: false
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin --config src-tauri/tauri.release.conf.json

      # The changelog is the single source of the notes. Doing it here rather than
      # in tauri-action's `releaseBody` means the text cannot drift from the entry
      # users read in the app's history, and a missing section fails the build.
      - name: Write the release notes from the changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          node scripts/release-notes.mjs "$version" > "$RUNNER_TEMP/notes.md"
          gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"

      # tauri-action publishes `latest.json` with api.github.com asset URLs,
      # which are rate-limited to 60 requests/hour unauthenticated; downloads then
      # fail with 403. Replace it with direct release-download URLs.
      - name: Point the normal updater at direct download URLs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          bundle="src-tauri/target/aarch64-apple-darwin/release/bundle"
          archive="FinanceTracker_${version}_aarch64.app.tar.gz"

          node scripts/updater-manifest.mjs \
            "$bundle/macos/FinanceTracker.app.tar.gz.sig" \
            "https://github.com/juliendf/FinanceTrackerApp/releases/download/${GITHUB_REF_NAME}/${archive}" \
            "$bundle/latest.json" \
            "FinanceTracker ${version}"

          gh release upload "$GITHUB_REF_NAME" "$bundle/latest.json" --clobber

      # The demo is a second bundle with its own identifier and its own updater
      # manifest. tauri-action only knows how to publish one app per release, so
      # the demo is built here and uploaded next to the normal assets.
      - name: Build the demo app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          npm run tauri build -- \
            --target aarch64-apple-darwin \
            --config src-tauri/tauri.demo.conf.json \
            --config src-tauri/tauri.release.conf.json

      - name: Upload the demo build and its updater manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          bundle="src-tauri/target/aarch64-apple-darwin/release/bundle"
          archive="FinanceTracker-Demo_${version}_aarch64.app.tar.gz"
          dmg="FinanceTracker-Demo_${version}_aarch64.dmg"

          # No spaces in asset names: they end up in URLs.
          cp "$bundle/macos/FinanceTracker Demo.app.tar.gz" "$bundle/$archive"
          cp "$bundle/macos/FinanceTracker Demo.app.tar.gz.sig" "$bundle/$archive.sig"
          cp "$bundle/dmg/FinanceTracker Demo_${version}_aarch64.dmg" "$bundle/$dmg"

          node scripts/updater-manifest.mjs \
            "$bundle/$archive.sig" \
            "https://github.com/juliendf/FinanceTrackerApp/releases/download/${GITHUB_REF_NAME}/${archive}" \
            "$bundle/latest-demo.json"

          gh release upload "$GITHUB_REF_NAME" \
            "$bundle/$archive" "$bundle/$archive.sig" "$bundle/$dmg" \
            "$bundle/latest-demo.json" --clobber
